        body { font-family: 'Inter', sans-serif; background-color: #000; color: white; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #dc2626; }

        /* iPhone Mockup Responsive */
        .iphone-frame {
            border: 12px solid #1a1a1a;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            background: #000;
            width: 100%;
            max-width: 340px;
            height: 700px;
            max-height: 80vh; /* Se ajusta a pantallas pequeñas */
            margin: 0 auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .iphone-notch {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100px; height: 24px; background: #1a1a1a;
            border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; z-index: 20;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Grid Pattern Background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, #222 1px, transparent 1px),
                              linear-gradient(to bottom, #222 1px, transparent 1px);
            background-position: center;
        }
    </style>

            const btnOwner = document.getElementById('btn-owner');

            if (role === 'client') {
                btnClient.className = "px-4 py-2 rounded-md text-xs font-bold transition-all bg-red-600 text-white shadow-lg";
                btnOwner.className = "px-4 py-2 rounded-md text-xs font-bold transition-all text-gray-400 hover:text-white";
            } else {
                btnClient.className = "px-4 py-2 rounded-md text-xs font-bold transition-all text-gray-400 hover:text-white";
                btnOwner.className = "px-4 py-2 rounded-md text-xs font-bold transition-all bg-white text-black shadow-lg";
            }
        }

        function renderContent() {
            const data = contentData[currentModule];
            if (data.hasToggle) {
                document.getElementById('content-area').innerHTML = data[currentRole];
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // Init
        renderModule('intro');

    </script>
</body>
</html>
